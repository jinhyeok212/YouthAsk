experiment_id: exp_full_kure_v4_section_heading_800_ov120
experiment_name: full-dataset-kure-section-heading-800-chunk-example
schema_version: "1.1"
base_experiment_id: null

dataset:
  version: ontong_youth_full_v1
  preprocessing_version: prep_v1
  document_path: data/processed/ontong_youth_full_v1/documents.jsonl
  manifest_path: data/processed/ontong_youth_full_v1/dataset_manifest.json

# 조건별 청크 생성 예시. 같은 조건으로 다시 실행하면 기존 산출물을 재사용한다.
# 경로의 {chunking_version}은 설정 로더가 chunking.version으로 한 번 치환하고,
# 이후 모든 단계(청킹/입력 검증/평가/산출물 기록)가 같은 경로를 사용한다.
chunking:
  version: section_heading_800_ov120_v1
  mode: generate
  strategy: section
  size: 800
  overlap: 120
  unit: characters
  target_field: retrieval_text
  chunk_path: data/processed/ontong_youth_full_v1/chunks/{chunking_version}/chunks.jsonl
  manifest_path: data/processed/ontong_youth_full_v1/chunks/{chunking_version}/chunk_manifest.json

evaluation:
  version: eval_full_v1
  questions_path: data/evaluation/eval_full_v1/eval_questions.jsonl
  document_qrels_path: data/evaluation/eval_full_v1/qrels.jsonl
  # 확정(검수 완료) chunk qrels 위치. 근거가 부족하면 이 파일은 만들지 않고
  # 같은 폴더에 qrels_chunk.candidates.jsonl / qrels_chunk_review_required.jsonl을 만든 뒤
  # Index 생성 전에 중단한다. 검수한 정답을 이 위치에 저장하고 다시 실행한다.
  chunk_qrels_path: data/evaluation/eval_full_v1/chunk_qrels/{chunking_version}/qrels_chunk.jsonl
  ks: [1, 3, 5]

embedding:
  model: nlpai-lab/KURE-v1
  # This commit is the exact revision resolved in the successful baseline run log.
  revision: 8b418a58414668e75532ed045c22d9ca018ae2b2
  dimension: 1024
  normalize: true
  batch_size: 32
  device: auto

index:
  # v4 uses a new index namespace because the reproducibility signature is stricter
  # (index version + embedding revision are now part of the signature).
  version: index_full_kure_v4_section_heading_800_ov120
  db_path: indexes/chroma/index_full_kure_v4_section_heading_800_ov120
  collection_name: ontong_youth_full_kure_v4_section_heading_800_ov120
  distance_metric: cosine
  db_batch_size: 256

retrieval:
  evaluation_max_k: 5
  # Reserved for the future Generator/Context stage. It does not change retrieval
  # metrics in the current offline retrieval-only runner.
  context_top_k: 3

execution:
  # partial: keep artifacts and return PARTIAL_SUCCESS if any query retrieval fails.
  # fail: save artifacts first, then make the command fail.
  retrieval_error_policy: partial

output:
  root: experiments
