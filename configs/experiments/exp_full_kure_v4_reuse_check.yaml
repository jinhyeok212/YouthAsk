experiment_id: exp_full_kure_v4_reuse_check
experiment_name: full-dataset-kure-v4-reuse-check
schema_version: "1.1"
base_experiment_id: exp_full_kure_v4_team

dataset:
  version: ontong_youth_full_v1
  preprocessing_version: prep_v1
  document_path: data/processed/ontong_youth_full_v1/documents.jsonl
  manifest_path: data/processed/ontong_youth_full_v1/dataset_manifest.json

chunking:
  version: c2_section_800_v1
  strategy: section
  size: 800
  overlap: 120
  unit: characters
  target_field: retrieval_text
  chunk_path: data/processed/ontong_youth_full_v1/chunks.jsonl
  manifest_path: data/processed/ontong_youth_full_v1/chunk_manifest.json

evaluation:
  version: eval_full_v1
  questions_path: data/evaluation/eval_full_v1/eval_questions.jsonl
  document_qrels_path: data/evaluation/eval_full_v1/qrels.jsonl
  chunk_qrels_path: data/evaluation/eval_full_v1/qrels_chunk.jsonl
  ks: [1, 3, 5]

embedding:
  model: nlpai-lab/KURE-v1
  revision: 8b418a58414668e75532ed045c22d9ca018ae2b2
  dimension: 1024
  normalize: true
  batch_size: 32
  device: auto

index:
  version: index_full_kure_v4
  db_path: indexes/chroma/index_full_kure_v4
  collection_name: ontong_youth_full_kure_v4
  distance_metric: cosine
  db_batch_size: 256

retrieval:
  evaluation_max_k: 5
  context_top_k: 3

execution:
  retrieval_error_policy: partial

output:
  root: experiments
